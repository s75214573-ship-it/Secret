<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    
    <!-- White / Silver Gradient for 'win' -->
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Vibrant Gold Gradient for 'X' and 'bet' -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF385"/>
      <stop offset="35%" stop-color="#FFC000"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7A1"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Orbital Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FDE68A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Group for entire logo -->
  <g transform="skewX(-6) translate(15, 0)">
    <!-- Lower Orbit Swoosh (looping from bottom-left around X) -->
    <path d="M 175 145 C 130 148 105 130 115 110 C 122 97 150 82 205 72 C 170 85 145 98 140 108 C 134 120 155 132 185 130 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- 'win' text in bold white metallic -->
    <text x="25" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, Arial, sans-serif" font-size="88" font-weight="900" fill="url(#winGrad)" filter="url(#shadow)" letter-spacing="-2">win</text>

    <!-- Upper Orbit Swoosh (looping from top-right around X) -->
    <path d="M 225 15 C 275 12 305 28 295 48 C 288 62 255 78 200 88 C 235 75 260 62 265 52 C 272 40 250 28 215 30 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Golden Crown sitting atop the 'X' -->
    <g transform="translate(195, 2)" filter="url(#shadow)">
      <!-- 5-Point Crown -->
      <polygon points="12,18 20,40 32,22 44,40 52,18 56,48 8,48" fill="url(#crownGrad)"/>
      <circle cx="12" cy="17" r="2.5" fill="#FFFBEB"/>
      <circle cx="32" cy="20" r="3" fill="#FFFBEB"/>
      <circle cx="52" cy="17" r="2.5" fill="#FFFBEB"/>
      <rect x="7" y="47" width="50" height="4" rx="2" fill="url(#crownGrad)"/>
    </g>

    <!-- Prominent Golden 'X' -->
    <text x="182" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, Arial, sans-serif" font-size="118" font-weight="950" fill="url(#goldGrad)" filter="url(#glow)">X</text>

    <!-- 'bet' text in vibrant gold -->
    <text x="272" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, Arial, sans-serif" font-size="88" font-weight="900" fill="url(#goldGrad)" filter="url(#shadow)" letter-spacing="-2">bet</text>
  </g>
</svg>
