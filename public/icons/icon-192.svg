<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="35%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#darkBg)"/>
  <rect x="5" y="5" width="182" height="182" rx="37" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Orbit Swooshes -->
  <!-- Top Right Swoosh -->
  <path d="M 115 42 C 145 38 165 48 160 62 C 155 72 135 82 105 88 C 125 78 140 70 142 62 C 146 54 130 46 110 48 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Bottom Left Swoosh -->
  <path d="M 85 145 C 55 148 35 138 40 124 C 45 114 65 104 95 98 C 75 108 60 116 58 124 C 54 132 70 140 90 138 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Crown atop X -->
  <g transform="translate(68, 30)" filter="url(#glow)">
    <polygon points="6,12 14,28 28,14 42,28 50,12 52,34 4,34" fill="url(#goldGrad)"/>
    <circle cx="6" cy="11" r="2.5" fill="#FFFBEB"/>
    <circle cx="28" cy="13" r="3" fill="#FFFBEB"/>
    <circle cx="50" cy="11" r="2.5" fill="#FFFBEB"/>
    <rect x="4" y="33" width="48" height="3" rx="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden X -->
  <g transform="skewX(-6) translate(14, 0)">
    <text x="82" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="108" font-weight="950" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">X</text>
  </g>

  <!-- Wordmark 'win' and 'bet' at bottom -->
  <text x="52" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-style="italic">win</text>
  <text x="136" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" font-style="italic">bet</text>
</svg>
