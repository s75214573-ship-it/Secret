<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="35%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.7"/>

  <!-- Orbit Swooshes -->
  <!-- Top Right Swoosh -->
  <path d="M 310 110 C 390 100 440 125 430 162 C 415 190 360 216 280 234 C 335 208 375 186 380 165 C 390 144 350 122 295 128 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Bottom Left Swoosh -->
  <path d="M 225 385 C 145 395 95 370 105 333 C 120 305 175 279 255 261 C 200 287 160 309 155 330 C 145 351 185 373 240 367 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Crown atop X -->
  <g transform="translate(182, 80)" filter="url(#glow)">
    <polygon points="16,32 38,74 74,38 110,74 132,32 138,90 10,90" fill="url(#goldGrad)"/>
    <circle cx="16" cy="30" r="7" fill="#FFFBEB"/>
    <circle cx="74" cy="35" r="8" fill="#FFFBEB"/>
    <circle cx="132" cy="30" r="7" fill="#FFFBEB"/>
    <rect x="10" y="88" width="128" height="8" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden X -->
  <g transform="skewX(-6) translate(36, 0)">
    <text x="220" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="288" font-weight="950" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">X</text>
  </g>

  <!-- Wordmark 'win' and 'bet' at bottom -->
  <text x="140" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-style="italic">win</text>
  <text x="360" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" font-style="italic">bet</text>
</svg>
