<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="35%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Maskable full bleed background -->
  <rect width="512" height="512" fill="#000000"/>
  <circle cx="256" cy="256" r="230" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Orbit Swooshes -->
  <!-- Top Right Swoosh -->
  <path d="M 310 120 C 380 110 425 132 415 165 C 400 190 350 214 280 230 C 330 206 368 186 372 168 C 380 148 345 130 295 135 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Bottom Left Swoosh -->
  <path d="M 225 375 C 155 385 110 363 120 330 C 135 305 185 281 255 265 C 205 289 168 309 164 327 C 155 347 190 365 240 360 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Crown atop X -->
  <g transform="translate(187, 95)" filter="url(#glow)">
    <polygon points="16,32 38,74 74,38 110,74 132,32 138,90 10,90" fill="url(#goldGrad)"/>
    <circle cx="16" cy="30" r="7" fill="#FFFBEB"/>
    <circle cx="74" cy="35" r="8" fill="#FFFBEB"/>
    <circle cx="132" cy="30" r="7" fill="#FFFBEB"/>
    <rect x="10" y="88" width="128" height="8" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden X -->
  <g transform="skewX(-6) translate(36, 0)">
    <text x="220" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="950" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">X</text>
  </g>

  <!-- Wordmark 'win' and 'bet' at bottom -->
  <text x="150" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-style="italic">win</text>
  <text x="350" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" font-style="italic">bet</text>
</svg>
