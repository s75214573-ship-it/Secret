<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Full bleed background for Android circle/squircle masks -->
  <rect width="512" height="512" fill="url(#bgMask)"/>
  <!-- Safe zone graphics centered within inner 80% (64px to 448px) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fef08a" stroke-width="4" stroke-opacity="0.3"/>
  <g filter="url(#shadowMask)">
    <text x="256" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="url(#goldMask)" text-anchor="middle" letter-spacing="-6">WX</text>
  </g>
</svg>
